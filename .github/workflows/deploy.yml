name: Auto Deploy Phantom & Detori

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - name: phantom
            apiUrl: /api-phantom-2027
            baseHref: /Phantom/2027/
            port: 3010
            target: /root/Phantom/itb/2027
            pm2: phantom-backend-2027

          - name: detori
            apiUrl: /api-detori-2027
            baseHref: /Detori/2027/
            port: 3011
            target: /root/Detori/itb/2027
            pm2: detori-backend-2027

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install -g npm@11.6.3
          set +e
          out=$( { node -v; npm -v; npm ci --no-audit --no-fund; } 2>&1 )
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=npm-install failed::$(echo "$out" | tail -40 | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
          exit $code

      - name: Frontend tests
        run: npx ng test --watch=false

      - name: Backend tests
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true' # the tests do not need a browser
        run: |
          npm ci
          npm test

      - name: Build frontend (${{ matrix.app.name }})
        run: |
          sed -i "s|apiUrl:.*|apiUrl: '${{ matrix.app.apiUrl }}'|g" src/environments/environment.prod.ts
          npm run build -- --configuration production --base-href ${{ matrix.app.baseHref }}

      - name: Deploy ${{ matrix.app.name }} to server
        # pinned to a release (v6.0.1): this action receives the SSH key, so it must not change by itself
        uses: easingthemes/ssh-deploy@5d8aeab1a56041e269567e67a08ce00df324a617
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          TARGET: ${{ matrix.app.target }}
          EXCLUDE: "/node_modules/, /backend/node_modules/, /.git/"
          # copy and update only; never delete files that exist only on the server (backend/.env, WhatsApp session)
          ARGS: "-rlgoDzvc -i"

      - name: Configure backend (${{ matrix.app.name }})
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            cd ${{ matrix.app.target }}/backend

            npm install --omit=dev
            # a long stop time lets WhatsApp close its browser and save the session (otherwise a QR code is asked again)
            pm2 delete ${{ matrix.app.pm2 }} || true
            pm2 start server.js --name ${{ matrix.app.pm2 }} --kill-timeout 20000
            pm2 save
