<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
          class="form-control"
          [disabled]="isLoading"
          />
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            class="form-control"
            [disabled]="isLoading"
            />
          </div>

          @if (errorMessage) {
            <div class="error-message">
              {{ errorMessage }}
            </div>
          }

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!loginForm.form.valid || isLoading"
            >
            @if (isLoading) {
              <span>Logging in...</span>
            }
            @if (!isLoading) {
              <span>Login</span>
            }
          </button>
        </form>
      </div>
    </div>
